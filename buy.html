<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KRIPAGA - Buy Product</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- HEADER -->

<header class="header">

    <img src="logs.jpeg.png" alt="KRIPAGA">

    <div class="logo">
        KRIPAGA
    </div>


    <button
        class="cart" style="background-color: yellow;"
        onclick="goHome()">

        🏠 Home

    </button>

</header>



<!-- BUY PAGE -->

<main class="buy-page">

    <h1>
        Buy Product
    </h1>


    <!-- PRODUCT -->

    <div id="buyProduct"></div>


    <!-- PAYMENT -->

    <div class="payment-box">

        <h2>
            Payment Details 💳
        </h2>


        <label>
            Card Holder Name
        </label>

        <input
            type="text"
            placeholder="Enter name"
        >


        <label>
            Card Number
        </label>

        <input
            type="text"
            placeholder="1234 5678 9012 3456"
        >


        <label>
            Expiry Date
        </label>

        <input
            type="text"
            placeholder="MM/YY"
        >


        <label>
            CVV
        </label>

        <input
            type="password"
            placeholder="CVV"
        >


        <button onclick="placeOrder()">
            PLACE ORDER
        </button>

    </div>

</main>



<!-- FOOTER -->

<footer class="king">

    <h3>KRIPAGA</h3>

    <p>
        FASHION AND ELECTRONICS ONLINE STORE
    </p>

</footer>


<script src="buy.js"></script>

</body>

</html>
