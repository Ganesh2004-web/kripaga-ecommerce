<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KRIPAGA - Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f3f6;
        }

        /* HEADER */

        .header {
            background: #2874f0;
            height: 65px;
            display: flex;
            align-items: center;
            padding: 0 8%;
            gap: 35px;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
        }

        .search {
            width: 500px;
            height: 40px;
            background: white;
            border-radius: 3px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .search input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
        }

        .header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }


        /* PROFILE CARD */

        .profile-container {
            width: 700px;
            margin: 40px auto;
        }

        .profile-card {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }


        /* PROFILE TOP */

        .profile-top {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 25px;
            border-bottom: 1px solid #eee;
        }

        .profile-img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #2874f0;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        .profile-info h2 {
            margin-bottom: 6px;
        }

        .profile-info p {
            color: #777;
            font-size: 14px;
        }

        .edit-btn {
            margin-left: auto;
            padding: 8px 18px;
            border: none;
            background: #2874f0;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }


        /* DETAILS */

        .details {
            padding: 25px 0;
        }

        .details h3 {
            margin-bottom: 18px;
        }

        .detail-row {
            display: flex;
            margin-bottom: 15px;
        }

        .detail-row label {
            width: 150px;
            color: #777;
            font-size: 14px;
        }

        .detail-row span {
            font-size: 14px;
            font-weight: 500;
        }


        /* MENU */

        .menu {
            border-top: 1px solid #eee;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 16px 5px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .menu-item:hover {
            color: #2874f0;
        }

        .menu-icon {
            width: 40px;
            font-size: 20px;
        }

        .menu-item span:nth-child(2) {
            flex: 1;
            font-size: 15px;
        }

        .arrow {
            color: #888;
        }

        .logout {
            color: #e53935;
            border-bottom: none;
        }


        /* RESPONSIVE */

        @media (max-width: 750px) {

            .profile-container {
                width: 90%;
            }

            .header {
                padding: 0 20px;
                gap: 15px;
            }

            .search {
                width: 100%;
            }

            .header a {
                display: none;
            }
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            KRIPAGA
        </div>

        <div class="search">

            🔍

            <input
                type="text"
                placeholder="Search for Products, Brands and More"
            >

        </div>

        <a href="index.html">
            🏠 Home
        </a>

    </div>



    <!-- PROFILE -->

    <div class="profile-container">

        <div class="profile-card">


            <!-- PROFILE TOP -->

            <div class="profile-top">

                <div class="profile-img">
                    G
                </div>

                <div class="profile-info">

                    <h2>
                        Ganesh
                    </h2>

                    <p>
                        Welcome to KRIPAGA 👋
                    </p>

                </div>

                <button
                    class="edit-btn"
                    onclick="editProfile()">

                    Edit

                </button>

            </div>



            <!-- PERSONAL DETAILS -->

            <div class="details">

                <h3>
                    Personal Information
                </h3>

                <div class="detail-row">

                    <label>
                        Full Name
                    </label>

                    <span>
                        Ganesh Bathini
                    </span>

                </div>


                <div class="detail-row">

                    <label>
                        Email
                    </label>

                    <span>
                        ganesh@gmail.com
                    </span>

                </div>


                <div class="detail-row">

                    <label>
                        Mobile
                    </label>

                    <span>
                        +91 98765 43210
                    </span>

                </div>

            </div>



            <!-- ACCOUNT MENU -->

            <div class="menu">


                <div class="menu-item">

                    <span class="menu-icon">
                        📦
                    </span>

                    <span>
                        My Orders
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </div>


                <div class="menu-item">

                    <span class="menu-icon">
                        ❤️
                    </span>

                    <span>
                        Wishlist
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </div>


                <div class="menu-item">

                    <span class="menu-icon">
                        🏠
                    </span>

                    <span>
                        Manage Addresses
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </div>


                <div class="menu-item">

                    <span class="menu-icon">
                        🔒
                    </span>

                    <span>
                        Login & Security
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </div>


                <div
                    class="menu-item logout"
                    onclick="logout()">

                    <span class="menu-icon">
                        🚪
                    </span>

                    <span>
                        Logout
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </div>


            </div>

        </div>

    </div>



    <script>

        function editProfile() {

            alert("Edit Profile coming soon!");

        }


        function logout() {

            let result =
                confirm("Do you want to logout?");

            if (result) {

                alert("Logged out successfully!");

                // Later:
                // window.location.href = "login.html";

            }

        }

    </script>


</body>

</html>
