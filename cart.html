<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KRIPAGA - Cart</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- HEADER -->

<header class="header">

    <img src="logs.jpeg.png" alt="KRIPAGA">

    <div class="logo">
        KRIPAGA
    </div>


    <div class="search-box">

        <span>🔍</span>

        <input
            type="text"
            placeholder="Search for Products, Brands and More"
        >

    </div>


    <button class="account">
        👤 Account ▾
    </button>


    <button class="more">
        More ▾
    </button>


    <button
        class="cart" style="background-color: yellow;"
        onclick="goHome()">

        🏠 Home

    </button>

</header>



<!-- CART -->

<main class="cart-page">

    <h1>
        My Cart 🛒
    </h1>


    <div id="cartProducts"></div>


    <div id="cartBottom"></div>

</main>



<!-- FOOTER -->

<footer class="king">

    <h3>KRIPAGA</h3>

    <p>
        FASHION AND ELECTRONICS ONLINE STORE
    </p>

</footer>


<script src="cart.js"></script>

</body>

</html>
